name: foundation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  quality:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: npm
      - run: npm install --global npm@11.15.0
      - run: npm ci
      - run: npm run check
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: npm
      - run: npm install --global npm@11.15.0
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node scripts/verify-jpeg-fixtures.mjs
      - run: node scripts/verify-webp-fixtures.mjs
      - run: node scripts/verify-gif-fixtures.mjs
      - run: node scripts/verify-bmp-fixtures.mjs
      - run: npm run build:extension
      - run: npm run test:browser
